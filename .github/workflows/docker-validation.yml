name: Docker Environment Validation

on:
  push:
    branches: [main,ronakmaheshwari-patch-1]
  pull_request:
    branches: [main,ronakmaheshwari-patch-1]

jobs:
  docker-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker (optional)
        # Only needed if pulling private images
        # uses: docker/login-action@v2
        # with:
        #   username: ${{ secrets.DOCKER_USERNAME }}
        #   password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build all Docker images
        run: |
          echo "Building Docker images with BuildKit..."
          DOCKER_BUILDKIT=1 docker compose -f docker-compose.dev.yml build --pull --progress=plain

      - name: Start Docker environment
        run: |
          echo "Starting Docker environment..."
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to initialize..."
          sleep 30

      - name: Validate Prometheus readiness
        run: |
          echo "Checking Prometheus readiness..."
          curl -f http://localhost:9090/-/ready

      - name: Validate Grafana health
        run: |
          echo "Checking Grafana health..."
          curl -f http://localhost:3001/api/health

      - name: Validate HTTP service
        run: |
          echo "Checking HTTP service..."
          curl -f http://localhost:3000/health

      - name: Validate Validator service
        run: |
          echo "Checking Validator service..."
          curl -f http://localhost:3002/health

      - name: Validate Webhook service
        run: |
          echo "Checking Webhook service..."
          curl -f http://localhost:3003/health

      - name: Tear down Docker environment
        if: always()
        run: |
          echo "Tearing down Docker environment..."
          docker compose -f docker-compose.dev.yml down -v